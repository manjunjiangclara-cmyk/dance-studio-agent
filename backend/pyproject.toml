[project]
name = "studio-copilot"
version = "0.1.0"
description = "Core administration backend for a teacher-reviewed ballet studio copilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "pydantic[email]>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
    "openai>=2,<3",
    "langgraph>=1,<2",
    "langsmith>=0.14.12,<0.15",
    "langgraph-checkpoint-postgres>=3,<4",
    "pyyaml>=6,<7",
    "authlib>=1.7,<2",
    "itsdangerous>=2.2,<3",
    "httpx>=0.28,<1",
    "joserfc>=1.6,<2",
    "python-multipart>=0.0.33,<0.1",
]

[dependency-groups]
dev = ["httpx2>=2,<3", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL pointing to a dedicated PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
