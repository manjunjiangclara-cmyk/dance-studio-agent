name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: tests-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: studio_copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot -d studio_copilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/studio_copilot_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Prepare checksum-verified offline tokenizer
        run: uv run --locked python -m studio_copilot.documents.chunking --prepare-tokenizer

      - name: Run unit and integration tests
        run: uv run --locked pytest

      - name: Check lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build website
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install browser test runtime
        working-directory: frontend
        run: npm exec playwright install --with-deps chromium

      - name: Start website test server
        env:
          DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/studio_copilot_test
          ADMIN_API_TOKEN: ci-only-test-token
          PUBLIC_BASE_URL: http://localhost:8010
        run: |
          uv run --locked uvicorn studio_copilot.api.app:app --host 127.0.0.1 --port 8010 > /tmp/studio-website.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8010/demo > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/studio-website.log
          exit 1

      - name: Check public and owner browser journeys
        working-directory: frontend
        run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'manjunjiangclara-cmyk/dance-studio-agent'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: dance-studio-aws-deployment
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      STUDIO_DEPLOY_INSTANCE_ID: ${{ vars.STUDIO_DEPLOY_INSTANCE_ID }}
      STUDIO_DEPLOY_BUCKET: ${{ vars.STUDIO_DEPLOY_BUCKET }}
      STUDIO_DEPLOY_ORIGIN: ${{ vars.STUDIO_DEPLOY_ORIGIN }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Skip superseded master commits
        id: current
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Master has advanced; the newer CI run owns deployment.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.current.outputs.deploy == 'true'
        uses: astral-sh/setup-uv@v10.3.2

      - name: Set up Python
        if: steps.current.outputs.deploy == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install deployment dependencies
        if: steps.current.outputs.deploy == 'true'
        working-directory: backend
        run: uv sync --locked --no-dev --group aws-validation

      - name: Obtain short-lived AWS credentials
        if: steps.current.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.STUDIO_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
          allowed-account-ids: '287785301532'
          role-duration-seconds: 7200

      - name: Deploy tested master commit and verify HTTPS
        if: steps.current.outputs.deploy == 'true'
        run: backend/.venv/bin/python deployment/ec2/ci_release.py
