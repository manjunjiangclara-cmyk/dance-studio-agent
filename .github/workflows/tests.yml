name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: studio_copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot -d studio_copilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/studio_copilot_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Prepare checksum-verified offline tokenizer
        run: uv run --locked python -m studio_copilot.documents.chunking --prepare-tokenizer

      - name: Run unit and integration tests
        run: uv run --locked pytest

      - name: Check lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build website
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install browser test runtime
        working-directory: frontend
        run: npm exec playwright install --with-deps chromium

      - name: Start website test server
        env:
          DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/studio_copilot_test
          ADMIN_API_TOKEN: ci-only-test-token
          PUBLIC_BASE_URL: http://localhost:8010
        run: |
          uv run --locked uvicorn studio_copilot.api.app:app --host 127.0.0.1 --port 8010 > /tmp/studio-website.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8010/demo > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/studio-website.log
          exit 1

      - name: Check public and owner browser journeys
        working-directory: frontend
        run: npm test
